<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자산 및 라이선스 관리 대시보드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f5f5f5;
            color: #333;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
                color: #e0e0e0;
            }
        }

        #root {
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- React 라이브러리 먼저 로드 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (CDN) - React 다음에 -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>

    <!-- Firebase 초기화 -->
    <script>
        // Firebase가 로드된 후에 초기화
        if (typeof firebase !== 'undefined') {
            const firebaseConfig = {
                apiKey: "AIzaSyD-a2D3x0vix7AuO3l3UgDfwAR6JU0UoXA",
                authDomain: "it-asset-manager-932b0.firebaseapp.com",
                databaseURL: "https://it-asset-manager-932b0-default-rtdb.firebaseio.com",
                projectId: "it-asset-manager-932b0",
                storageBucket: "it-asset-manager-932b0.appspot.com",
                messagingSenderId: "800093002825",
                appId: "1:800093002825:web:44381b198b3132b212b398",
                measurementId: "G-35WB0GLTK2"
            };

            try {
                firebase.initializeApp(firebaseConfig);
                window.firebaseDB = firebase.database();
                console.log('Firebase 초기화 완료');
            } catch (error) {
                console.error('Firebase 초기화 실패:', error);
            }
        } else {
            console.error('Firebase SDK가 로드되지 않았습니다.');
        }
    </script>
    
    <!-- 메인 앱 스크립트 - 마지막에 -->
    <script type="text/babel" src="app.js"></script>
</body>
</html>
